name: Daily Opportunity Scan

on:
  schedule:
    # 00:00 UTC daily ≈ 08:00 CST
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run scan
        env:
          PRODUCT_HUNT_API_TOKEN: ${{ secrets.PRODUCT_HUNT_API_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLASSIFIER_BACKEND: logistic
        run: |
          opportunity-miner scan --json-out | tee scan-summary.json
          # If live sources are heavily rate-limited, still produce a demo artifact for CI visibility
          if [ ! -f data/reports/latest.md ]; then
            opportunity-miner scan --demo
          fi

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-reports
          path: data/reports/

      - name: Commit latest report (optional branch)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "opportunity-miner-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p data/reports
          git add data/reports/latest.md data/reports/latest.csv data/reports/latest.json || true
          if git diff --staged --quiet; then
            echo "No report changes"
          else
            git commit -m "chore: daily opportunity report $(date -u +%Y-%m-%d)"
            git push
          fi
