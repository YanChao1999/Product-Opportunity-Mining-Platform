[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opportunity-miner"
version = "0.2.0"
description = "Extensible product-opportunity miner: multi-source scan + multi-dimension ranking + local need classifier"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "YanChao1999" }]
dependencies = [
  "httpx[socks]>=0.27",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  "click>=8.1",
  "schedule>=1.2",
  "python-dateutil>=2.9",
  "tenacity>=8.2",
]

[project.scripts]
opportunity-miner = "opportunity_miner.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-httpx>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opportunity_miner"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
